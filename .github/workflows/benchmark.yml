name: CiAi Host Adapter — Serialization Benchmarks

on:
  push:
    branches: [development]
  repository_dispatch:
    types: [serialization-development-changed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full FSM_Serialization source commit SHA to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: serialization-benchmarks-${{ github.event.client_payload.source_sha || inputs.source_sha || 'latest-development-source' }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Prepare evidence directories
        run: mkdir -p evidence TestResults

      - name: Checkout benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: benchmark

      - name: Resolve exact source SHA
        id: source
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event.client_payload.source_sha || inputs.source_sha || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$REQUESTED_SHA"
          if [[ -z "$sha" ]]; then
            branch_json="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/TrentBest/TheSingularityWorkshop.FSM_Serialization/branches/development)"
            sha="$(jq -r '.commit.sha // empty' <<< "$branch_json")"
          fi
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Source identity must be a full 40-character hexadecimal SHA."
            exit 1
          fi
          echo "sha=${sha,,}" >> "$GITHUB_OUTPUT"
          echo "Validated source SHA ${sha,,}"

      - name: Checkout exact FSM_Serialization source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TrentBest/TheSingularityWorkshop.FSM_Serialization
          ref: ${{ steps.source.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Checkout CiAi benchmark policy evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TrentBest/TheSingularityWorkshop.CiAi
          ref: e4d2b6a5cfd50df2ce610acaefb6350bdd3476da
          path: ciai
          persist-credentials: false

      - name: Restore source solution
        run: dotnet restore source/TheSingularityWorkshop.FSM_Serialization.slnx

      - name: Build exact source
        run: dotnet build source/TheSingularityWorkshop.FSM_Serialization.slnx --configuration Release --no-restore

      - name: Test exact source
        run: dotnet test source/TheSingularityWorkshop.FSM_Serialization.slnx --configuration Release --no-build --logger "trx;LogFileName=source-tests.trx" --results-directory ./TestResults/source

      - name: Restore benchmark harness against exact source project
        working-directory: benchmark
        run: dotnet restore "FSM_Serialization_Benchmarks.csproj" -p:UseSourceProject=true

      - name: Build benchmark harness against exact source project
        working-directory: benchmark
        run: dotnet build "FSM_Serialization_Benchmarks.csproj" --configuration Release --no-restore -p:UseSourceProject=true

      - name: Run correctness-gated benchmark smoke
        working-directory: benchmark
        shell: bash
        run: |
          set -euo pipefail
          # Isolate every invocation's artifacts: stale default BDN reports must never
          # satisfy this run's coverage gate.
          rm -rf ../evidence/smoke-artifacts
          mkdir -p ../evidence/smoke-artifacts
          dotnet run --project "FSM_Serialization_Benchmarks.csproj" --configuration Release --no-build -p:UseSourceProject=true -- --filter "*BinarySerializable_RoundTrip*" "*ReadPreparedPayload*" "*SER_INT_*" "*SER_BUF_*" --job Dry --artifacts "../evidence/smoke-artifacts" 2>&1 | tee ../evidence/benchmark-smoke.log
          python3 ../benchmark/scripts/validate_benchmark_smoke.py --log ../evidence/benchmark-smoke.log --report-root ../evidence/smoke-artifacts

      - name: Collect controlled NuGet baseline and exact-source candidate measurements
        working-directory: benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence/controlled
          # The smoke suite above remains the broad correctness/coverage gate. These are
          # independent, same-runner launches of one identical BenchmarkDotNet filter.
          dotnet restore "FSM_Serialization_Benchmarks.csproj" -p:UseSourceProject=false
          dotnet build "FSM_Serialization_Benchmarks.csproj" --configuration Release --no-restore -p:UseSourceProject=false
          for sample in 1 2 3 4 5; do
            echo "Published-package baseline sample $sample/5"
            dotnet run --project "FSM_Serialization_Benchmarks.csproj" --configuration Release --no-build -p:UseSourceProject=false -- --filter "*BinarySerializable_RoundTrip*" --artifacts "../evidence/controlled/baseline-$sample" 2>&1 | tee "../evidence/controlled/baseline-$sample.log"
          done
          # Re-resolve assets and rebuild against the exact checked-out source project.
          dotnet restore "FSM_Serialization_Benchmarks.csproj" -p:UseSourceProject=true
          dotnet build "FSM_Serialization_Benchmarks.csproj" --configuration Release --no-restore -p:UseSourceProject=true
          for sample in 1 2 3 4 5; do
            echo "Exact-source candidate sample $sample/5"
            dotnet run --project "FSM_Serialization_Benchmarks.csproj" --configuration Release --no-build -p:UseSourceProject=true -- --filter "*BinarySerializable_RoundTrip*" --artifacts "../evidence/controlled/candidate-$sample" 2>&1 | tee "../evidence/controlled/candidate-$sample.log"
          done
          python3 - <<'PY'
          import csv, glob, json, os, re, sys

          root = "../evidence/controlled"
          def parse_mean(raw):
              value = raw.strip().replace(",", "")
              match = re.fullmatch(r"([0-9]+(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?)\s*([a-zA-Zµμ]+)", value)
              if not match:
                  raise ValueError(f"Unrecognized BenchmarkDotNet Mean value: {raw!r}")
              amount = float(match.group(1))
              unit = match.group(2).lower().replace("μ", "µ")
              factors = {"ns": 1.0, "nanosecond": 1.0, "nanoseconds": 1.0,
                         "us": 1_000.0, "µs": 1_000.0, "microsecond": 1_000.0, "microseconds": 1_000.0,
                         "ms": 1_000_000.0, "millisecond": 1_000_000.0, "milliseconds": 1_000_000.0,
                         "s": 1_000_000_000.0, "second": 1_000_000_000.0, "seconds": 1_000_000_000.0}
              if unit not in factors:
                  raise ValueError(f"Unsupported BenchmarkDotNet time unit: {unit!r}")
              return amount * factors[unit]

          def sample(lane, index):
              pattern = f"{root}/{lane}-{index}/results/*report.csv"
              files = glob.glob(pattern, recursive=True)
              if len(files) != 1:
                  raise ValueError(f"{lane}-{index}: expected exactly one report CSV, found {files}")
              with open(files[0], newline="", encoding="utf-8-sig") as handle:
                  first = handle.read(4096)
                  handle.seek(0)
                  dialect = csv.Sniffer().sniff(first, delimiters=";,\t,")
                  rows = list(csv.DictReader(handle, dialect=dialect))
              if not rows:
                  raise ValueError(f"{files[0]} contains no measurement rows")
              normalized = {key.strip(): value for key, value in rows[0].items() if key is not None}
              mean_key = next((key for key in normalized if key.lower() == "mean"), None)
              method_key = next((key for key in normalized if key.lower() == "method"), None)
              if mean_key is None or method_key is None:
                  raise ValueError(f"{files[0]} lacks Method/Mean columns: {list(normalized)}")
              metric_names = {"mean", "error", "stddev", "median", "min", "max", "q1", "q3", "iqr", "op/s", "operations/second", "ratio", "ratio sd", "allocated", "alloc ratio", "gen0", "gen1", "gen2", "completed work items", "lock contentions"}
              identity_parts = [normalized[method_key].strip()]
              # Keep parameter/configuration columns (e.g. Size), not just columns
              # literally named Params; this prevents cross-parameter comparisons.
              for key, value in normalized.items():
                  if key.lower() != method_key.lower() and key.lower() not in metric_names and value is not None and str(value).strip():
                      identity_parts.append(key.strip() + "=" + str(value).strip())
              identity = "|".join(identity_parts)
              value = parse_mean(normalized[mean_key])
              if value <= 0:
                  raise ValueError(f"{files[0]} has a non-positive measurement")
              return value, identity, files[0]

          result = {"schema":"ciai.controlled-measurements.v1","baseline":[],"candidate":[],"workloadIdentity":None,"reports":[]}
          for lane in ("baseline", "candidate"):
              identities = []
              for index in range(1, 6):
                  value, identity, report = sample(lane, index)
                  result[lane].append(value)
                  identities.append(identity)
                  result["reports"].append(report)
              if len(set(identities)) != 1:
                  raise ValueError(f"{lane} runs did not select identical method/parameters: {identities}")
              if result["workloadIdentity"] is None:
                  result["workloadIdentity"] = identities[0]
              elif result["workloadIdentity"] != identities[0]:
                  raise ValueError(f"Baseline/candidate workload mismatch: {result['workloadIdentity']!r} vs {identities[0]!r}")
          with open("../evidence/controlled-measurements.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2)
              handle.write("\n")
          print(json.dumps({"workloadIdentity":result["workloadIdentity"],"baselineSamples":len(result["baseline"]),"candidateSamples":len(result["candidate"]),"reports":len(result["reports"])}, indent=2))
          PY

      - name: Verify reports and write provenance
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          HARNESS_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          report_dir="evidence/smoke-artifacts"
          if [[ ! -d "$report_dir" ]] || ! find "$report_dir" -type f -name '*report.csv' -print -quit | grep -q .; then
            echo "::error::Validated smoke artifacts do not contain BenchmarkDotNet CSV reports."
            find evidence -maxdepth 6 -type f -print || true
            exit 1
          fi
          mkdir -p evidence
          smoke_log="evidence/benchmark-smoke.log"
          if [[ ! -s "$smoke_log" ]]; then
            echo "::error::Benchmark smoke log is missing or empty."
            exit 1
          fi
          report_count="$(find "$report_dir" -type f -name '*report.csv' | wc -l | tr -d ' ')"
          if [[ ! -s evidence/controlled-measurements.json ]]; then
            echo "::error::Controlled repeated measurements are missing."
            exit 1
          fi
          jq -n --slurpfile controlled evidence/controlled-measurements.json \
            --arg schema "ciai.benchmark-host-evidence.v1" \
            --arg sourceRepository "TrentBest/TheSingularityWorkshop.FSM_Serialization" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg harnessRepository "$REPOSITORY" \
            --arg harnessSha "$HARNESS_SHA" \
            --arg workflowPath ".github/workflows/benchmark.yml" \
            --arg runId "$RUN_ID" \
            --arg runAttempt "$RUN_ATTEMPT" \
            --arg benchmarkLane "published-package-vs-exact-source" \
            --arg reportDirectory "$report_dir" \
            --arg reportCount "$report_count" \
            '{schema:$schema,sourceRepository:$sourceRepository,sourceSha:$sourceSha,harnessRepository:$harnessRepository,harnessSha:$harnessSha,workflowPath:$workflowPath,runId:($runId|tonumber),runAttempt:($runAttempt|tonumber),benchmarkLane:$benchmarkLane,sourceTests:"passed",correctnessGate:"passed",benchmarkSmoke:"passed",reportDirectory:$reportDirectory,reportCount:($reportCount|tonumber),expectedBenchmarkCases:44,performanceVerdict:"pending-policy-evaluation",lane:$benchmarkLane,sourceTestsPassed:true,correctnessPassed:true,reportsPresent:true,provenanceComplete:true,candidateMeasurementsNanoseconds:$controlled[0].candidate,baselineMeasurementsNanoseconds:$controlled[0].baseline,workloadIdentity:$controlled[0].workloadIdentity}' \
            > evidence/benchmark-host-evidence.json
          cp -R "$report_dir" evidence/benchmark-reports
          cp -R TestResults evidence/source-test-results

      - name: Evaluate evidence with CiAi policy
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project ciai/tools/CiAi.BenchmarkPolicy.Cli/CiAi.BenchmarkPolicy.Cli.csproj --configuration Release -- evidence/benchmark-host-evidence.json evidence/benchmark-policy-result.json
          jq -e '(.Schema // .schema) == "ciai.benchmark-policy-result.v1" and ((.Verdict // .verdict) == "passed" or (.Verdict // .verdict) == "regression") and (.CandidateSampleCount // .candidateSampleCount) >= 5 and (.BaselineSampleCount // .baselineSampleCount) >= 5 and (.CandidateMedianNanoseconds // .candidateMedianNanoseconds) > 0 and (.BaselineMedianNanoseconds // .baselineMedianNanoseconds) > 0' evidence/benchmark-policy-result.json
          verdict="$(jq -r '.Verdict // .verdict' evidence/benchmark-policy-result.json)"
          if [[ "$verdict" == "regression" ]]; then
            echo "::error::CiAi detected a median regression exceeding the configured tolerance."
            exit 1
          fi

      - name: Upload exact-SHA benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: serialization-benchmark-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            benchmark/BenchmarkDotNet.Artifacts/
            TestResults/
          if-no-files-found: warn
          retention-days: 90
